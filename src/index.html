<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https: http: blob:; worker-src 'self' blob:; img-src 'self' file: data: blob:; media-src 'self' file: blob:; style-src 'self' 'unsafe-inline';" />
  <title>프레임핏 | 영상 비율 변환</title>
  <link rel="stylesheet" href="style.css?v=20261008-framefit" />
</head>
<body>
  <aside id="sidebar">
    <div id="siteBrand">프레임핏</div>
    <section class="panel">
      <h2>1. 영상</h2>
      <div class="row">
        <button id="btnVideo" class="primary">영상 선택</button>
        <span id="videoName" class="file">없음</span>
      </div>
      <div id="videoInfo" class="dim"></div>
    </section>

    <section class="panel">
      <h2>2. 출력 비율</h2>
      <div id="presets" class="presets"></div>
      <div class="row">
        <label>가로 <input id="outW" type="number" min="16" step="2" /></label>
        <label>세로 <input id="outH" type="number" min="16" step="2" /></label>
        <span id="ratioLabel" class="dim"></span>
      </div>
    </section>

    <section class="panel">
      <h2>3. 영상 위치</h2>
      <div class="row">
        <span id="posStart" class="dim">상단</span>
        <input id="pos" type="range" min="0" max="100" value="50" />
        <span id="posEnd" class="dim">하단</span>
      </div>
      <div class="row">
        <button data-pos="0">상단</button>
        <button data-pos="50">중앙</button>
        <button data-pos="100">하단</button>
        <label class="grow right">배경색 <input id="bg" type="color" value="#000000" /></label>
      </div>
      <div class="row">
        <label>영상 크기 <input id="videoScale" type="range" min="30" max="100" value="100" /></label>
        <span id="videoScaleValue" class="dim">100%</span>
      </div>
      <div class="row"><button id="btnAutoFit" hidden>투명 영역에 맞추기</button></div>
    </section>

    <section class="panel">
      <h2>4. 배경 이미지</h2>
      <div class="row">
        <button id="btnImage">이미지 선택</button>
        <span id="imageName" class="file">없음</span>
        <button id="btnClearImage" disabled>제거</button>
      </div>
      <div class="row">
        <input id="imageUrl" type="url" class="grow" placeholder="또는 이미지 URL 붙여넣기" />
        <button id="btnImageUrl">가져오기</button>
      </div>
      <div class="row">
        <label>배치
          <select id="imageMode">
            <option value="auto" selected>자동 (배너 형태에 맞춰 배치)</option>
            <option value="margins">보이는 여백에 맞추기</option>
            <option value="canvas">전체 화면 배경</option>
            <option value="overlay">영상 위에 표시 (투명 배너)</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>맞춤
          <select id="imageFit">
            <option value="contain" selected>안에 맞추기 (잘리지 않음)</option>
            <option value="cover">꽉 채우기 (넘치면 잘림)</option>
            <option value="stretch">늘리기 (비율 무시)</option>
          </select>
        </label>
      </div>
      <div class="dim">PNG의 투명한 공간을 찾으면 그 자리에 영상을 자동 배치합니다. 위치나 크기를 조절하면 수동 배치로 전환됩니다.</div>
    </section>

    <section class="panel">
      <h2>5. 내보내기</h2>
      <div class="row">
        <label>화질
          <select id="crf">
            <option value="16">최고 (CRF 16)</option>
            <option value="18" selected>높음 (CRF 18)</option>
            <option value="23">보통 (CRF 23)</option>
          </select>
        </label>
        <label>속도
          <select id="speed">
            <option value="veryfast" selected>빠름</option>
            <option value="fast">균형</option>
            <option value="medium">기존</option>
          </select>
        </label>
      </div>
      <div class="row">
        <button id="btnExport" class="primary grow">MP4로 내보내기</button>
        <button id="btnCancel" hidden>취소</button>
      </div>
      <div id="progressWrap" hidden><div id="progressBar"></div></div>
      <div id="status" class="dim"></div>
    </section>
  </aside>

  <main id="preview">
    <div id="stage">
      <div id="canvasWrap">
        <canvas id="canvas" width="1080" height="1080"></canvas>
        <div id="marginOverlay" aria-label="남은 여백 크기"></div>
      </div>
    </div>
    <div id="transport">
      <button id="btnPlay" disabled>재생</button>
      <input id="seek" type="range" min="0" max="1000" value="0" disabled />
      <span id="time" class="dim">0:00 / 0:00</span>
    </div>
    <div id="hint" class="dim">영상 영역을 클릭하면 영상을, 배경을 클릭하면 이미지를 고릅니다. 파일을 끌어다 놓아도 됩니다.</div>
  </main>

  <video id="video" muted playsinline preload="auto"></video>
  <div id="toast" hidden></div>
  <!-- bridge.js: 데스크톱은 src/bridge.js(Electron), 웹 빌드는 web/bridge.js(ffmpeg.wasm) 가 같은 이름으로 들어간다 -->
  <script src="layout.js"></script>
  <script src="filtergraph.js"></script>
  <script src="bridge.js"></script>
  <script src="ui.js?v=20261008-auto-slot"></script>
</body>
</html>
